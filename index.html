<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compás a compás</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="references/fonts.css"><link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/sheet.css"><link rel="stylesheet" href="styles/workspace.css">
  <script type="module" src="src/main.js"></script>
</head>
<body class="compact-workspace">
  <a class="skip" href="#panel-acorde">Saltar al editor de tarjetas</a>
  <header class="topbar">
    <div class="brand"><img class="brand-icon" src="assets/icon.svg" alt="" width="34" height="34"><div class="brand-text"><h1>Compás a compás</h1><span class="brand-version">Tu cuaderno de acordes</span></div></div>
    <button id="open-song" class="song-context" type="button" aria-haspopup="dialog" aria-controls="song-dialog" title="Editar datos de la canción"><span id="song-title">Canción</span><span class="song-context-meta"><span id="song-key"></span><span class="context-edit">Editar datos</span></span></button>
    <div class="topbar-file" role="group" aria-label="Archivo y exportación">
      <p id="estado-archivo" class="file-state" aria-live="polite"></p>
      <button type="button" id="btn-deshacer" class="btn tool-icon" data-history="undo" data-icon="undo" aria-label="Deshacer" title="Deshacer · Ctrl+Z fuera de los campos" disabled></button>
      <button type="button" id="btn-rehacer" class="btn tool-icon" data-history="redo" data-icon="redo" aria-label="Rehacer" title="Rehacer · Ctrl+Y / Ctrl+Mayús+Z fuera de los campos" disabled></button>
      <button type="button" id="btn-abrir" class="btn" data-icon="folder">Abrir</button>
      <button type="button" id="open-colors" class="btn" data-icon="palette" aria-haspopup="dialog" aria-controls="colors-dialog">Colores</button>
      <a id="btn-manual" class="btn" href="ayuda/index.html" target="_blank" rel="noopener" data-icon="book" title="Abrir el manual de uso en otra pestaña">Manual</a>
      <button type="button" id="btn-guardar" class="btn btn-primary" data-icon="save">Guardar JSON</button>
      <details class="action-menu" id="export-menu"><summary class="btn" data-icon="export">Exportar</summary><div class="menu-content"><button type="button" id="btn-exportar-html" class="btn">Exportar HTML</button><button type="button" id="btn-imprimir" class="btn">Imprimir / PDF</button></div></details>
      <details class="action-menu"><summary class="btn tool-icon" aria-label="Más opciones de archivo" title="Más opciones de archivo" data-icon="more"></summary><div class="menu-content"><button type="button" id="btn-nuevo" class="btn">Nueva canción</button><button type="button" id="open-song-menu" class="btn">Datos de la canción</button></div></details>
    </div>
    <input type="file" id="archivo-json" accept=".json,application/json" hidden>
  </header>
  <p id="aviso-carga" class="aviso-carga" role="alert" hidden></p>
  <main class="layout">
    <div class="editor-workspace" id="edicion"><section class="panel measure-navigator" id="panel-compases" aria-labelledby="t-compases"></section><section class="panel chord-workspace" id="panel-acorde" aria-labelledby="t-acorde"></section></div>
    <section class="panel panel-vista" id="panel-vista" aria-labelledby="t-vista"></section>
  </main>
  <footer class="workspace-status"><span class="creditos">Creado por: Jesus Quevedo Rodriguez</span><span>Versión 0.7.4</span></footer>
  <dialog id="song-dialog" class="dialog settings-dialog" aria-labelledby="t-cancion"><button type="button" class="btn tool-icon dialog-close" data-close="song-dialog" aria-label="Cerrar datos de la canción" data-icon="close"></button><section id="panel-cancion"></section><div class="dialog-actions"><button type="button" class="btn btn-primary" data-close="song-dialog">Listo</button></div></dialog>
  <dialog id="marks-dialog" class="dialog settings-dialog" aria-labelledby="t-marcas"><button type="button" class="btn tool-icon dialog-close" data-close="marks-dialog" aria-label="Cerrar estructura musical" data-icon="close"></button><section id="panel-marcas" class="panel"></section><div class="dialog-actions"><button type="button" class="btn btn-primary" data-close="marks-dialog">Listo</button></div></dialog>
  <dialog id="colors-dialog" class="dialog settings-dialog colors-dialog" aria-labelledby="t-colors"><button type="button" class="btn tool-icon dialog-close" data-close="colors-dialog" aria-label="Cerrar colores" data-icon="close"></button><section id="panel-colors"></section><div class="dialog-actions"><button type="button" class="btn" id="reset-colors">Restaurar paleta original</button><button type="button" class="btn btn-primary" data-close="colors-dialog">Listo</button></div></dialog>
  <p id="estado-vivo" class="sr-only" role="status" aria-live="polite"></p><p id="toast" class="toast" aria-hidden="true" hidden></p>
</body>
</html>
